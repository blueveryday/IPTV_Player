name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate version number
        run: echo "VER=$(TZ=Asia/Shanghai date +%y.%m.%d)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleRelease --no-daemon -PbuildDate=${{ env.VER }}

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player_Android_v${{ env.VER }}
          path: app/build/outputs/apk/release/*.apk

      - name: upload Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v${VER}"

          echo "=== APK 目录内容 ==="
          ls -la app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1)
          if [ -z "$APK" ]; then
            echo "❌ 没有找到 APK"
            exit 1
          fi
          echo "✅ 找到 APK：$APK"

          gh release delete "$TAG" --cleanup-tag --yes || true

          gh release create "$TAG" "${APK}#IPTV Player_Android ${TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "IPTV Player_Android ${TAG}" \
            --notes "编译日期 20${VER//./-}（UTC+8），提交 ${GITHUB_SHA::7}"