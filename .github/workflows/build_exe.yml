name: Build IPTV Player EXE (Nuitka + MSVC)
on:
  workflow_dispatch:

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install nuitka python-mpv ordered-set zstandard

      - name: Detect version from entry file
        id: version
        shell: pwsh
        run: |
          $file = Get-Item -LiteralPath "IPTV Player.pyw" -ErrorAction SilentlyContinue
          if (-not $file) {
            throw "未找到入口文件 'IPTV Player.pyw'，请检查仓库根目录"
          }
          $text = Get-Content -LiteralPath $file.FullName -Raw -Encoding UTF8
          if ($text -match 'CODE_VERSION\s*=\s*["''][^"'']*?v(\d+(?:\.\d+)*)["'']') {
            $version = $matches[1]
          } else {
            throw "未能从 'IPTV Player.pyw' 中解析出 CODE_VERSION 里的版本号"
          }
          Write-Host "入口文件: $($file.Name)"
          Write-Host "版本号: $version"
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          Write-Host "提交: $shortSha"
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "ENTRY_FILE=$($file.Name)" >> $env:GITHUB_ENV
          echo "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV

      - name: Download libmpv (GPL)
        shell: pwsh
        run: |
          $url = "https://github.com/mpv-player/mpv/releases/download/git-release/libmpv-v0.41.0-dev-g88eb9f2e7-38148483931-x86_64-w64-mingw32-gpl.zip"
          $archive = Join-Path $env:RUNNER_TEMP "libmpv.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "libmpv_extracted"

          Write-Host "正在下载 libmpv (GPL) 从: $url"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing

          Write-Host "正在解压..."
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          New-Item -ItemType Directory -Path $extractDir | Out-Null
          Expand-Archive -Path $archive -DestinationPath $extractDir -Force

          $libmpvDll = Get-ChildItem -Path $extractDir -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $libmpvDll) { throw "解压后未找到 libmpv-2.dll" }

          Copy-Item $libmpvDll.FullName -Destination "libmpv-2.dll" -Force
          $sizeMb = [math]::Round((Get-Item "libmpv-2.dll").Length / 1MB, 1)
          Write-Host "已获取 libmpv-2.dll (GPL)，大小: $sizeMb MB"

      - name: Build EXE with Nuitka (MSVC)
        shell: pwsh
        run: |
          python -m nuitka --standalone --windows-console-mode=disable --windows-icon-from-ico=src/asset/iptv.ico --enable-plugin=tk-inter --include-module=mpv --include-data-dir=src=src --nofollow-import-to=unittest --nofollow-import-to=test --nofollow-import-to=pydoc --nofollow-import-to=cgi --nofollow-import-to=cgitb --nofollow-import-to=chunk --nofollow-import-to=colorsys --nofollow-import-to=configparser --nofollow-import-to=crypt --nofollow-import-to=filecmp --nofollow-import-to=fileinput --nofollow-import-to=graphlib --nofollow-import-to=html.parser --nofollow-import-to=_markupbase --nofollow-import-to=imaplib --nofollow-import-to=imghdr --nofollow-import-to=mailcap --nofollow-import-to=modulefinder --nofollow-import-to=pickletools --nofollow-import-to=pipes --nofollow-import-to=poplib --nofollow-import-to=pstats --nofollow-import-to=pyclbr --nofollow-import-to=sched --nofollow-import-to=sndhdr --nofollow-import-to=sre_compile --nofollow-import-to=sre_constants --nofollow-import-to=sre_parse --nofollow-import-to=symtable --nofollow-import-to=timeit --nofollow-import-to=tomllib --nofollow-import-to=trace --nofollow-import-to=uu --nofollow-import-to=xdrlib --nofollow-import-to=_pyio --nofollow-import-to=importlib.simple --nofollow-import-to=importlib.resources.simple --noinclude-pytest-mode=nofollow --noinclude-setuptools-mode=nofollow --python-flag=no_docstrings --msvc=latest --lto=yes --assume-yes-for-downloads --remove-output --output-dir=dist --output-filename="IPTV Player.exe" "$env:ENTRY_FILE"

      - name: Bundle libmpv / ffmpeg / ffprobe
        shell: pwsh
        env:
          FFMPEG_VERSION: "8.1.2"
        run: |
          # ---- 1. 找到 Nuitka 生成的 .dist 目录 ----
          $dist = Get-ChildItem -Path dist -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $dist) { throw "未找到 Nuitka 生成的 .dist 目录" }
          Write-Host "目标目录: $($dist.FullName)"
          echo "DIST_DIR=$($dist.FullName)" >> $env:GITHUB_ENV

          if (-not (Test-Path "libmpv-2.dll")) {
            throw "工作目录未找到 libmpv-2.dll，请检查下载步骤"
          }
          Copy-Item "libmpv-2.dll" -Destination $dist.FullName -Force
          $sizeMb = [math]::Round((Get-Item (Join-Path $dist.FullName "libmpv-2.dll")).Length / 1MB, 1)
          Write-Host "已放入 libmpv-2.dll，大小: $sizeMb MB"

          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$env:FFMPEG_VERSION-essentials_build.7z"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.7z"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg_extracted"

          Write-Host "正在下载 FFmpeg $env:FFMPEG_VERSION ..."
          Write-Host "地址: $url"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing

          Write-Host "正在解压..."
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          New-Item -ItemType Directory -Path $extractDir | Out-Null

          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "C:\Program Files\7-Zip\7z.exe" }
          if (-not (Test-Path $sevenZip)) { throw "未找到 7z，无法解压 .7z 文件" }

          & $sevenZip x $archive "-o$extractDir" -y
          if ($LASTEXITCODE -ne 0) { throw "7z 解压失败，退出码 $LASTEXITCODE" }

          $ffmpeg = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "压缩包中未找到 ffmpeg.exe" }
          if (-not $ffprobe) { throw "压缩包中未找到 ffprobe.exe" }

          Copy-Item $ffmpeg.FullName -Destination $dist.FullName -Force
          Copy-Item $ffprobe.FullName -Destination $dist.FullName -Force

          $ffSizeMb = [math]::Round(
            ((Get-Item (Join-Path $dist.FullName "ffmpeg.exe")).Length +
             (Get-Item (Join-Path $dist.FullName "ffprobe.exe")).Length) / 1MB, 1)
          Write-Host "已放入 ffmpeg.exe + ffprobe.exe，共 $ffSizeMb MB"

          Write-Host "`n=== dist 目录中的关键文件 ==="
          Get-ChildItem $dist.FullName -File |
            Where-Object { $_.Name -in @("IPTV Player.exe","libmpv-2.dll","ffmpeg.exe","ffprobe.exe") } |
            Format-Table Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,1)}} -AutoSize

      - name: Smoke test (启动 15 秒，确认没有闪退)
        shell: pwsh
        run: |
          $exe = Join-Path $env:DIST_DIR "IPTV Player.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory $env:DIST_DIR -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            throw "程序启动后立即退出（退出码 $($p.ExitCode)），可能缺少模块或文件"
          }
          Write-Host "程序运行正常，结束进程"
          Stop-Process -Id $p.Id -Force

      - name: Package to 7z
        shell: pwsh
        run: |
          $releaseDir = "IPTV Player"
          $archive = "IPTV Player v$env:APP_VERSION-$env:SHORT_SHA.7z"
          Rename-Item -Path $env:DIST_DIR -NewName $releaseDir

          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "C:\Program Files\7-Zip\7z.exe" }
          if (-not (Test-Path $sevenZip)) { throw "未找到 7z，可先添加一步 choco install 7zip" }

          Push-Location dist
          try {
            & $sevenZip a -t7z -mx=9 -m0=lzma2 -ms=on -mmt=on "../$archive" $releaseDir
            if ($LASTEXITCODE -ne 0) { throw "7z 压缩失败，退出码 $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $mb = [math]::Round((Get-Item $archive).Length / 1MB, 1)
          Write-Host "压缩包大小: $mb MB"
          echo "ARCHIVE_NAME=$archive" >> $env:GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}
          name: v${{ env.APP_VERSION }} (${{ env.SHORT_SHA }})
          body: |
            构建自提交: ${{ github.sha }}

            本发行版已内置：
            - libmpv 播放核心（libmpv-2.dll）
            - FFmpeg / FFprobe（LGPL/GPL，来自 https://www.gyan.dev/ffmpeg/builds/）
          files: IPTV*.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}