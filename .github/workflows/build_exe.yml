name: Build IPTV Player EXE (Nuitka + MSVC)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install nuitka python-vlc ordered-set zstandard

      - name: Detect version from entry file
        id: version
        shell: pwsh
        run: |
          $file = Get-Item -LiteralPath "IPTV Player.pyw" -ErrorAction SilentlyContinue
          if (-not $file) {
            throw "未找到入口文件 'IPTV Player.pyw'，请检查仓库根目录"
          }
          $text = Get-Content -LiteralPath $file.FullName -Raw -Encoding UTF8
          if ($text -match 'CODE_VERSION\s*=\s*["''][^"'']*?v(\d+(?:\.\d+)*)["'']') {
            $version = $matches[1]
          } else {
            throw "未能从 'IPTV Player.pyw' 中解析出 CODE_VERSION 里的版本号"
          }
          Write-Host "入口文件: $($file.Name)"
          Write-Host "版本号: $version"
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "ENTRY_FILE=$($file.Name)" >> $env:GITHUB_ENV

      - name: Build EXE with Nuitka (MSVC)
        shell: pwsh
        run: |
          python -m nuitka --standalone --windows-console-mode=disable --windows-icon-from-ico=src/asset/iptv.ico --enable-plugin=tk-inter --include-module=vlc --include-data-dir=src=src --nofollow-import-to=unittest --nofollow-import-to=test --nofollow-import-to=pydoc --nofollow-import-to=cgi --nofollow-import-to=cgitb --nofollow-import-to=chunk --nofollow-import-to=colorsys --nofollow-import-to=configparser --nofollow-import-to=crypt --nofollow-import-to=filecmp --nofollow-import-to=fileinput --nofollow-import-to=graphlib --nofollow-import-to=html.parser --nofollow-import-to=_markupbase --nofollow-import-to=imaplib --nofollow-import-to=imghdr --nofollow-import-to=mailcap --nofollow-import-to=modulefinder --nofollow-import-to=pickletools --nofollow-import-to=pipes --nofollow-import-to=poplib --nofollow-import-to=pstats --nofollow-import-to=pyclbr --nofollow-import-to=sched --nofollow-import-to=sndhdr --nofollow-import-to=sre_compile --nofollow-import-to=sre_constants --nofollow-import-to=sre_parse --nofollow-import-to=stringprep --nofollow-import-to=symtable --nofollow-import-to=timeit --nofollow-import-to=tomllib --nofollow-import-to=trace --nofollow-import-to=uu --nofollow-import-to=xdrlib --nofollow-import-to=_pyio --nofollow-import-to=importlib.simple --nofollow-import-to=importlib.resources.simple --noinclude-pytest-mode=nofollow --noinclude-setuptools-mode=nofollow --python-flag=no_docstrings --msvc=latest --lto=yes --assume-yes-for-downloads --remove-output --output-dir=dist --output-filename="IPTV Player.exe" "$env:ENTRY_FILE"

      - name: Bundle vlc_module
        shell: pwsh
        run: |
          if (-not (Test-Path "vlc_module/libvlc.dll")) {
            throw "未找到 vlc_module/libvlc.dll，请检查仓库中的 vlc_module 目录"
          }
          $dist = Get-ChildItem -Path dist -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $dist) {
            throw "未找到 Nuitka 生成的 .dist 目录"
          }
          $vlc = Join-Path $dist.FullName "vlc_module"
          Copy-Item -Path "vlc_module" -Destination $vlc -Recurse -Force

          $dropDirs = "gui","access_output","stream_out","mux","visualization","services_discovery","lua","meta_engine"
          foreach ($d in $dropDirs) {
            Remove-Item -Recurse -Force (Join-Path $vlc "plugins/$d") -ErrorAction SilentlyContinue
          }
          $dropFiles = "axvlc.dll","npvlc.dll","plugins/codec/libx264_plugin.dll","plugins/codec/libx26410b_plugin.dll","plugins/codec/libx265_plugin.dll"
          foreach ($f in $dropFiles) {
            Remove-Item -Force (Join-Path $vlc $f) -ErrorAction SilentlyContinue
          }

          $must = "libvlc.dll","libvlccore.dll","plugins/access/libhttp_plugin.dll","plugins/access/libhttps_plugin.dll","plugins/access/liblive555_plugin.dll","plugins/codec/libavcodec_plugin.dll","plugins/demux/libts_plugin.dll","plugins/video_output/libdirect3d11_plugin.dll","plugins/audio_output/libmmdevice_plugin.dll"
          foreach ($f in $must) {
            if (-not (Test-Path (Join-Path $vlc $f))) { throw "缺少必需的 VLC 组件: $f" }
          }
          $mb = [math]::Round((Get-ChildItem $vlc -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "vlc_module 精简后大小: $mb MB"
          echo "DIST_DIR=$($dist.FullName)" >> $env:GITHUB_ENV

      - name: Smoke test (启动 10 秒，确认没有闪退)
        shell: pwsh
        run: |
          $exe = Join-Path $env:DIST_DIR "IPTV Player.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory $env:DIST_DIR -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            throw "程序启动后立即退出（退出码 $($p.ExitCode)），可能缺少模块或文件"
          }
          Write-Host "程序运行正常，结束进程"
          Stop-Process -Id $p.Id -Force

      - name: Package to 7z
        shell: pwsh
        run: |
          $releaseDir = "IPTV Player"
          $archive = "IPTV Player v$env:APP_VERSION.7z"
          Rename-Item -Path $env:DIST_DIR -NewName $releaseDir

          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "C:\Program Files\7-Zip\7z.exe" }
          if (-not (Test-Path $sevenZip)) { throw "未找到 7z，可先添加一步 choco install 7zip" }

          Push-Location dist
          try {
            & $sevenZip a -t7z -mx=9 -m0=lzma2 -ms=on -mmt=on "../$archive" $releaseDir
            if ($LASTEXITCODE -ne 0) { throw "7z 压缩失败，退出码 $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $mb = [math]::Round((Get-Item $archive).Length / 1MB, 1)
          Write-Host "压缩包大小: $mb MB"
          echo "ARCHIVE_NAME=$archive" >> $env:GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          files: IPTV*.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
